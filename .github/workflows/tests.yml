name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    name: Tox ${{ matrix.session }} session on Python ${{ matrix.python-version }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.11", session: "black" }
          - { python-version: "3.11", session: "flake8" }
          - { python-version: "3.11", session: "mypy" }
          - { python-version: "3.11", session: "isort" }
          - { python-version: "3.15", session: "py315" }
          - { python-version: "3.14", session: "py314" }
          - { python-version: "3.13", session: "py313" }
          - { python-version: "3.12", session: "py312" }
          - { python-version: "3.11", session: "py311" }

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Activate Hermit
        uses: cashapp/activate-hermit@v1

      - name: Install Python ${{ matrix.python-version }}
        run: hermit install python3@${{ matrix.python-version }}

      - name: Run tox
        run: |
          python3 -m pip install tox
          python3 -m tox -e ${{ matrix.session }}
