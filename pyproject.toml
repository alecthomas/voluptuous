[tool.black]
target-version = ["py311", "py312", "py313", "py314", "py315"]
skip-string-normalization = true

[tool.isort]
skip_gitignore = true
profile = "black"
multi_line_output = 5

[tool.mypy]
python_version = "3.11"

warn_unused_ignores = true

[tool.pytest.ini_options]
python_files = "tests.py"
testpaths = "voluptuous/tests"
addopts = "--doctest-glob=*.md -v"
